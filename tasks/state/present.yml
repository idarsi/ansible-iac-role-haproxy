---
- name: "Install HAProxy package"
  ansible.builtin.package:
    name: "{{ haproxy_package_name }}"
    state: "present"

- name: "Verify HAProxy privilege-drop account"
  ansible.builtin.getent:
    database: "passwd"
    key: "{{ haproxy_model.global.user }}"
    fail_key: false
  register: haproxy_user_entry

- name: "Verify HAProxy privilege-drop group"
  ansible.builtin.getent:
    database: "group"
    key: "{{ haproxy_model.global.group }}"
    fail_key: false
  register: haproxy_group_entry

- name: "Require the package-provided non-privileged HAProxy identity"
  ansible.builtin.assert:
    that:
      - "haproxy_model.global.user in ansible_facts.getent_passwd"
      - "haproxy_model.global.group in ansible_facts.getent_group"
      - "(ansible_facts.getent_passwd[haproxy_model.global.user][1] | int) > 0"
      - "(ansible_facts.getent_passwd[haproxy_model.global.user][2] | int) > 0"
      - "(ansible_facts.getent_group[haproxy_model.global.group][1] | int) > 0"
    fail_msg: "HAProxy must use the package-provided non-privileged haproxy user and group; the account is missing or privileged."

- name: "Ensure HAProxy configuration directory exists"
  ansible.builtin.stat:
    path: "{{ haproxy_config_directory }}"
  register: haproxy_config_directory_before

- name: "Check existing HAProxy ownership marker"
  ansible.builtin.stat:
    path: "{{ haproxy_managed_marker }}"
    follow: false
  register: haproxy_marker_before

- name: "Ensure HAProxy configuration directory exists"
  ansible.builtin.file:
    path: "{{ haproxy_config_directory }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"

- name: "Write HAProxy managed marker"
  ansible.builtin.copy:
    dest: "{{ haproxy_managed_marker }}"
    content: "role_managed_configuration=true\n"
    owner: "root"
    group: "root"
    mode: "0600"
  when: not haproxy_marker_before.stat.exists | default(false)

- name: "Render HAProxy configuration"
  ansible.builtin.template:
    src: "haproxy.cfg.j2"
    dest: "{{ haproxy_config_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "{{ haproxy_binary_path }} -c -f %s"
  register: haproxy_configuration_render

- name: "Inspect HAProxy service state before configuration reload"
  ansible.builtin.service_facts:
  when:
    - "haproxy_configuration_render is changed"
    - "not (haproxy_update_package_changed | default(false) | bool)"

- name: "Reload HAProxy after a configuration change"
  ansible.builtin.service:
    name: "{{ haproxy_service_name }}"
    state: "reloaded"
  when:
    - "haproxy_configuration_render is changed"
    - "not (haproxy_update_package_changed | default(false) | bool)"
    - "ansible_facts.services[haproxy_service_name ~ '.service'].state | default('') == 'running'"

- name: "Enable and start HAProxy"
  ansible.builtin.service:
    name: "{{ haproxy_service_name }}"
    enabled: true
    state: "started"
