---
- name: "Validate destructive cleanup path"
  ansible.builtin.assert:
    that:
      - "haproxy_config_directory is string"
      - "haproxy_config_directory.startswith('/')"
      - "haproxy_config_directory not in ['/', '/etc', '/usr', '/var', '/home', '/root']"
      - "haproxy_managed_marker == haproxy_config_directory ~ '/.idarsi-managed'"
      - "haproxy_config_path.startswith(haproxy_config_directory ~ '/')"
    fail_msg: "all_absent requires a non-empty absolute configuration directory that is not a system parent path."
  when: (state | default('present')) == 'all_absent'

- name: "Validate HAProxy modes and defaults"
  ansible.builtin.assert:
    that:
      - "haproxy_model.defaults.mode is string"
      - "haproxy_model.defaults.mode in ['http', 'tcp']"
      - "haproxy_model.global.maxconn is integer and haproxy_model.global.maxconn >= 1"
      - "haproxy_model.global.user == 'haproxy'"
      - "haproxy_model.global.group == 'haproxy'"
      - >-
        (haproxy_model.frontends | selectattr('mode', 'defined') |
        map(attribute='mode') | list | difference(['http', 'tcp']) | length) == 0
      - >-
        (haproxy_model.backends | selectattr('mode', 'defined') |
        map(attribute='mode') | list | difference(['http', 'tcp']) | length) == 0
    fail_msg: "HAProxy modes must be 'http' or 'tcp', and the privilege-drop identity must be the package-provided haproxy user and group."

- name: "Validate HAProxy record types"
  ansible.builtin.assert:
    that:
      - "(haproxy_model.frontends | select('mapping') | list | length) == (haproxy_model.frontends | length)"
      - "(haproxy_model.backends | select('mapping') | list | length) == (haproxy_model.backends | length)"
    fail_msg: "HAProxy frontends and backends must contain mapping records."

- name: "Validate unique HAProxy names"
  ansible.builtin.assert:
    that:
      - >-
        (haproxy_model.frontends | map(attribute='name') | list |
         unique | length) == (haproxy_model.frontends | length)
      - >-
        (haproxy_model.backends | map(attribute='name') | list |
         unique | length) == (haproxy_model.backends | length)
      - >-
        (haproxy_model.frontends | map(attribute='name') | list |
         intersect(haproxy_model.backends | map(attribute='name') |
        list) | length) == 0
    fail_msg: "Frontend and backend names are required and must be unique across HAProxy resources."

- name: "Validate frontend records"
  ansible.builtin.assert:
    that:
      - "haproxy_frontend.name is string and haproxy_frontend.name is match('^[A-Za-z][A-Za-z0-9_.-]*$')"
      - "haproxy_frontend.bind is defined and haproxy_frontend.bind is string"
      - "not (haproxy_frontend.bind is search('[\\x00-\\x1f\\x7f]'))"
      - "haproxy_frontend.port is integer and haproxy_frontend.port >= 1 and haproxy_frontend.port <= 65535"
      - "haproxy_frontend.default_backend is not defined or haproxy_frontend.default_backend is string"
      - >-
        haproxy_frontend.default_backend is not defined or
        haproxy_frontend.default_backend in (haproxy_model.backends |
        map(attribute='name') | list)
      - "(haproxy_frontend.certificates | default([]) | select('string') | list | length) == (haproxy_frontend.certificates | default([]) | length)"
      - "(haproxy_frontend.certificates | default([]) | select('match', '^/') | list | length) == (haproxy_frontend.certificates | default([]) | length)"
      - "(haproxy_frontend.certificates | default([]) | select('search', '[\\x00-\\x1f\\x7f]') | list | length) == 0"
      - "(haproxy_frontend.certificates | default([]) | select('search', '[\\r\\n]') | list | length) == 0"
    fail_msg: "Each frontend needs a valid name, bind address, port, and backend reference."
  loop: "{{ haproxy_model.frontends }}"
  loop_control:
    loop_var: "haproxy_frontend"

- name: "Validate backend records and server ports"
  ansible.builtin.assert:
    that:
      - "haproxy_backend.name is string and haproxy_backend.name is match('^[A-Za-z][A-Za-z0-9_.-]*$')"
      - >-
        haproxy_backend.servers is defined and haproxy_backend.servers is sequence and
        haproxy_backend.servers is not string and haproxy_backend.servers | length > 0
      - "(haproxy_backend.servers | select('mapping') | list | length) == (haproxy_backend.servers | length)"
      - "(haproxy_backend.servers | map(attribute='name') | list | unique | length) == (haproxy_backend.servers | length)"
      - "(haproxy_backend.servers | map(attribute='port') | select('integer') | list | length) == (haproxy_backend.servers | length)"
      - "(haproxy_backend.servers | map(attribute='port') | select('ge', 1) | select('le', 65535) | list | length) == (haproxy_backend.servers | length)"
      - "(haproxy_backend.servers | map(attribute='address') | select('string') | list | length) == (haproxy_backend.servers | length)"
    fail_msg: "Each backend needs at least one server with unique names and ports from 1 to 65535."
  loop: "{{ haproxy_model.backends }}"
  loop_control:
    loop_var: "haproxy_backend"

- name: "Validate HAProxy server values"
  ansible.builtin.assert:
    that:
      - "haproxy_server_record.1.name is string and haproxy_server_record.1.name is match('^[A-Za-z][A-Za-z0-9_.-]*$')"
      - "haproxy_server_record.1.address | haproxy_valid_backend_address"
      - "haproxy_server_record.1.check | default(true) is boolean"
      - "haproxy_server_record.1.ssl | default(false) is boolean"
      - "haproxy_server_record.1.sni is not defined or (haproxy_server_record.1.sni is string and haproxy_server_record.1.sni is match('^[A-Za-z0-9_.-]+$'))"
      - >-
        haproxy_server_record.1.verifyhost is not defined or
        (haproxy_server_record.1.verifyhost is string and
        haproxy_server_record.1.verifyhost is match('^[A-Za-z0-9_.-]+$'))
      - "not (haproxy_server_record.1.ssl | default(false)) or haproxy_server_record.1.verifyhost is defined"
    fail_msg: >-
      Each backend server needs a valid hostname, IPv4 address, or IPv6 literal;
      address '{{ haproxy_server_record.1.address | default('undefined') }}'
      is invalid. IPv6 values are parsed as real literals (for example
      2001:db8::1), and every server needs a unique name and port from 1 to
      65535.
  loop: "{{ query('ansible.builtin.subelements', haproxy_model.backends, 'servers') }}"
  loop_control:
    loop_var: "haproxy_server_record"

- name: "Validate stats safety and certificates"
  ansible.builtin.assert:
    that:
      - >-
        not haproxy_model.stats.enabled or
        haproxy_model.stats.bind in
        ['127.0.0.1', '::1', 'localhost']
      - "haproxy_model.stats.enabled is boolean"
      - "haproxy_model.stats.bind is string"
      - "haproxy_model.stats.port is integer and haproxy_model.stats.port >= 1 and haproxy_model.stats.port <= 65535"
      - "haproxy_model.stats.uri is string and haproxy_model.stats.uri is match('^/')"
      - "not (haproxy_model.stats.uri is search('[\\x00-\\x1f\\x7f]'))"
    fail_msg: "Stats must bind to loopback with a valid port and URI."

- name: "Validate global and defaults directives"
  ansible.builtin.assert:
    that:
      - "haproxy_directive.key is string and haproxy_directive.key is match('^[A-Za-z][A-Za-z0-9_-]*$')"
      - "not ((haproxy_directive.value | string) is search('[\\x00-\\x1f\\x7f]'))"
      - "haproxy_directive.value is not mapping"
      - >-
        haproxy_directive.value is not sequence or haproxy_directive.value is string or
        (haproxy_directive.value | map('string') | select('search', '[\\x00-\\x1f\\x7f]') | list | length) == 0
    fail_msg: "HAProxy global and defaults directives must use safe names and values."
  loop: "{{ (haproxy_model.global | dict2items) + (haproxy_model.defaults | dict2items) }}"
  loop_control:
    loop_var: "haproxy_directive"

- name: "Validate nested HAProxy security settings"
  ansible.builtin.assert:
    that:
      - "(haproxy_model.security.keys() | difference(['backend_tls_verify', 'backend_tls_ca_file', 'backend_tls_ca_directory']) | list | length) == 0"
    fail_msg: "HAProxy security only supports backend_tls_verify=true unless the explicit insecure opt-in haproxy_allow_insecure_backend_tls=true is set."

- name: "Validate HAProxy backend TLS security settings"
  ansible.builtin.assert:
    that:
      - "haproxy_model.security.backend_tls_verify is boolean"
      - "haproxy_model.security.backend_tls_ca_file is string"
      - "haproxy_model.security.backend_tls_ca_directory is string"
      - "not haproxy_model.security.backend_tls_ca_file or haproxy_model.security.backend_tls_ca_file is match('^/')"
      - "not haproxy_model.security.backend_tls_ca_directory or haproxy_model.security.backend_tls_ca_directory is match('^/')"
      - "not haproxy_model.security.backend_tls_ca_file or '//' not in haproxy_model.security.backend_tls_ca_file"
      - "not haproxy_model.security.backend_tls_ca_file or '..' not in haproxy_model.security.backend_tls_ca_file.split('/')"
      - "not haproxy_model.security.backend_tls_ca_directory or '//' not in haproxy_model.security.backend_tls_ca_directory"
      - "not haproxy_model.security.backend_tls_ca_directory or '..' not in haproxy_model.security.backend_tls_ca_directory.split('/')"
      - "not (haproxy_model.security.backend_tls_ca_file and haproxy_model.security.backend_tls_ca_directory)"
      - >-
        haproxy_model.security.backend_tls_verify or
        (haproxy_allow_insecure_backend_tls | default(false) | bool)
    fail_msg: "HAProxy security only supports backend_tls_verify=true unless the explicit insecure opt-in haproxy_allow_insecure_backend_tls=true is set."

- name: "Validate secure backend TLS trust material"
  ansible.builtin.assert:
    that:
      - >-
        not (haproxy_server_record.1.ssl | default(false)) or
        not haproxy_model.security.backend_tls_verify or
        haproxy_model.security.backend_tls_ca_file | length > 0 or
        (haproxy_model.security.backend_tls_ca_directory | length > 0 and
        haproxy_server_record.1.ca_file is defined and
        haproxy_server_record.1.ca_file is string and
        haproxy_server_record.1.ca_file is match('^[A-Za-z0-9_.-]+$'))
      - >-
        not (haproxy_server_record.1.ssl | default(false)) or
        not haproxy_model.security.backend_tls_verify or
        haproxy_server_record.1.verifyhost is defined
      - >-
        haproxy_server_record.1.ca_file is not defined or
        (haproxy_server_record.1.ca_file is string and
        haproxy_server_record.1.ca_file is match('^[A-Za-z0-9_.-]+$') and
        (haproxy_model.security.backend_tls_ca_directory | length) > 0 and
        not haproxy_model.security.backend_tls_ca_file)
    fail_msg: >-
      Secure TLS backend server '{{ haproxy_server_record.1.name | default('unknown') }}' requires
      trust material: set security.backend_tls_ca_file, or set security.backend_tls_ca_directory
      and server.ca_file, and provide verifyhost.
  loop: "{{ query('ansible.builtin.subelements', haproxy_model.backends, 'servers') }}"
  loop_control:
    loop_var: "haproxy_server_record"
