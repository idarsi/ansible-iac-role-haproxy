---
dependency:
  name: "galaxy"
driver:
  name: "podman"
platforms:
  - name: "rocky9-guardrails"
    image: "quay.io/rockylinux/rockylinux:9-ubi-init"
    command: "/sbin/init"
    privileged: true
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    pre_build_image: true
provisioner:
  name: "ansible"
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "create"
    - "converge"
    - "verify"
    - "destroy"
