---
- name: "Converge HAProxy"
  hosts: "all"
  vars:
    iac_blueprint:
      haproxy:
        frontends:
          - name: "web"
            bind: "127.0.0.1"
            port: 8080
            default_backend: "apps"
        backends:
          - name: "apps"
            servers:
              - name: "app1"
                address: "127.0.0.1"
                port: 9000
                ssl: true
                verifyhost: "app1.example.test"
              - name: "app6"
                address: "2001:db8::1"
                port: 9001
        security:
          backend_tls_verify: false
    haproxy_allow_insecure_backend_tls: true
  roles:
    - role: "ansible-iac-role-haproxy"
