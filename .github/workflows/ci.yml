---
name: "CI"
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  fast-checks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - uses: "redhat-actions/podman-install@v1"
      - run: >-
          python -m pip install --disable-pip-version-check
          'ansible-core>=2.15,<2.19' 'ansible-lint>=24,<26'
          'yamllint>=1.35,<2' 'molecule>=25,<26'
          'molecule-plugins[podman]>=23,<24'
      - run: "yamllint ."
      - run: "ansible-playbook --syntax-check -i docs/inventory-minimal.yml docs/playbook-example.yml"
      - run: "ansible-lint --profile production"
      - run: "molecule test -s validation"
      - run: "molecule test -s baseline"
      - run: "molecule test -s guardrails"
