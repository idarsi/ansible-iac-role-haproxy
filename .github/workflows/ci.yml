---
name: "CI"
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  fast-checks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - run: "python -m pip install ansible ansible-lint yamllint"
      - run: "ansible-playbook --syntax-check -i docs/inventory-minimal.yml docs/playbook-example.yml"
      - run: "ansible-lint --profile production"
