---
name: "CI"
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  fast-checks:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"  # v4.2.2
      - uses: "actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38"  # v5.6.0
        with:
          python-version: "3.12"
      - uses: "redhat-actions/podman-install@4a134a65f7324b2d03498c672cd4c6bce93e94b5"  # v1.1.1
      - run: >-
          python -m pip install --disable-pip-version-check
          'ansible-core==2.18.6' 'ansible-lint==25.1.2'
          'yamllint==1.35.1' 'molecule==25.2.0'
          'molecule-plugins[podman]==23.5.0'
      - run: "yamllint ."
      - run: "ansible-playbook --syntax-check -i docs/inventory-minimal.yml docs/playbook-example.yml"
      - run: "ansible-lint --profile production"
      - run: "molecule test -s validation"
      - run: "molecule test -s baseline"
      - run: "molecule test -s guardrails"
      - run: "molecule test -s update"
      - run: "molecule test -s lifecycle"
